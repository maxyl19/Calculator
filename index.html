<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EDWIN's Calculator Pro</title>
  <style>
    :root{
      --bg-start: #ee7752;
      --bg-mid: #e73c7e;
      --bg-end: #23a6d5;
      --bg-accent: #23d5ab;
      --bg-spot: rgba(255,255,255,0.15);
      --card-blur: 30px;
      --btn-radius: 20px;
      --btn-hi: #4dffb8;
      --text-light: #ffffff;
      --text-dark: #1a1a1a;
      --shadow: 0 15px 40px rgba(0,0,0,.25);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    @media (prefers-color-scheme: dark) {
      :root { --bg-start: #0f0f0f; --bg-mid: #1a1a1a; --bg-end: #1e1e1e; --bg-accent: #2a2a2a; }
    }

    body {
      background: linear-gradient(-45deg, var(--bg-start), var(--bg-mid), #23a6d5, var(--bg-accent));
      background-size: 400% 400%;
      animation: gradientShift 15s ease infinite;
      font-family: 'Courier New', monospace;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    @keyframes gradientShift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }

    .calculator {
      width: 100%;
      max-width: 420px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(var(--card-blur));
      border-radius: 28px;
      border: 2px solid rgba(255, 255, 255, 0.4);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .display {
      padding: 20px 20px 14px;
      background: rgba(0, 0, 0, 0.75);
      border-bottom: 1px solid rgba(255,255,255,0.15);
      border-radius: 28px 28px 0 0;
    }

    .expression {
      color: rgba(255,255,255,0.9);
      font-size: 14px;
      height: 20px;
      min-height: 20px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 6px;
      letter-spacing: .5px;
      opacity: .9;
      user-select: none;
    }

    #result {
      background: linear-gradient(145deg, #ffd700, #ffed4e);
      color: #1a1a1a;
      font-size: 38px;
      font-weight: 900;
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 0 20px;
      border-radius: 20px;
      margin: 8px 0 0;
      box-shadow: 0 15px 40px rgba(255, 215, 0, 0.6);
      line-height: 1;
      overflow: hidden;
    }

    .buttons {
      padding: 22px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-auto-rows: 72px;
      gap: 16px;
    }

    .btn {
      border: none;
      border-radius: var(--btn-radius);
      font-size: 22px;
      font-weight: 900;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.2s ease;
      color: white;
      box-shadow: 0 10px 30px rgba(0,0,0,.25);
      user-select: none;
    }

    .btn:hover { transform: translateY(-4px); }
    .btn:active { transform: translateY(1px) scale(0.98); }

    .btn.digit {
      background: linear-gradient(145deg, #aafff4, #80ffcc);
      color: #00695c;
    }
    .btn.op {
      background: linear-gradient(145deg, #6a7cff, #00b4ff);
      color: white;
    }
    .btn.equal {
      background: linear-gradient(145deg, #f95f5f, #f74d4d);
    }
    .btn.grid-mini { height: 72px; }

    .btn.zero { grid-column: span 2; }

    /* Small improvements for accessibility in high-contrast environments */
    .btn:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 2px;
    }

    /* Optional layout tweak for very small screens */
    @media (max-width: 420px) {
      .buttons { grid-gap: 12px; padding: 16px; }
      #result { font-size: 32px; height: 64px; }
    }
  </style>
</head>
<body>
  <main class="calculator" aria-label="Calcuator Pro">
    <section class="display" aria-label="Display" role="region">
      <div id="expr" class="expression" aria-live="off"></div>
      <div id="result" aria-label="Current value" role="textbox" aria-readonly="true">0</div>
    </section>

    <section class="buttons" aria-label="Calculator keypad" role="grid">
      <!-- Row 1 -->
      <button class="btn" data-value="AC" aria-label="All Clear">AC</button>
      <button class="btn" data-value="DEL" aria-label="Delete">DEL</button>
      <button class="btn" data-value="%" aria-label="Percent">%</button>
      <button class="btn op" data-value="/" aria-label="Divide">/</button>

      <!-- Row 2 -->
      <button class="btn digit" data-value="7" aria-label="7">7</button>
      <button class="btn digit" data-value="8" aria-label="8">8</button>
      <button class="btn digit" data-value="9" aria-label="9">9</button>
      <button class="btn op" data-value="*" aria-label="Multiply">*</button>

      <!-- Row 3 -->
      <button class="btn digit" data-value="4" aria-label="4">4</button>
      <button class="btn digit" data-value="5" aria-label="5">5</button>
      <button class="btn digit" data-value="6" aria-label="6">6</button>
      <button class="btn op" data-value="-" aria-label="Subtract">-</button>

      <!-- Row 4 -->
      <button class="btn digit" data-value="1" aria-label="1">1</button>
      <button class="btn digit" data-value="2" aria-label="2">2</button>
      <button class="btn digit" data-value="3" aria-label="3">3</button>
      <button class="btn op" data-value="+" aria-label="Add">+</button>

      <!-- Row 5 -->
      <button class="btn digit zero" data-value="0" aria-label="0">0</button>
      <button class="btn digit" data-value="." aria-label="Decimal">.</button>
      <button class="btn equal" data-value="=" aria-label="Equals">=</button>
      <!-- Hidden spacer button to keep grid nice on some renderers (not visible) -->
      <button class="btn" aria-label="" style="visibility:hidden; height:0; padding:0; border:none;"></button>
    </section>
  </main>

  <script>
    // Calculator logic with keyboard support and accessible UI
    (function(){
      const exprEl = document.getElementById('expr');
      const resultEl = document.getElementById('result');

      let current = '0';
      let first = null;
      let operator = null;
      let shouldReset = false;

      function updateDisplay() {
        resultEl.textContent = current;
        if (first !== null && operator) {
          exprEl.textContent = first + ' ' + operator;
        } else {
          exprEl.textContent = '';
        }
      }

      function inputDigit(d) {
        if (shouldReset) { current = '0'; shouldReset = false; }
        if (current === '0' && d !== '.') current = d;
        else current += d;
        updateDisplay();
      }

      function inputDot() {
        if (shouldReset) { current = '0'; shouldReset = false; }
        if (!current.includes('.')) current += '.';
        updateDisplay();
      }

      function clearAll() {
        current = '0';
        first = null;
        operator = null;
        shouldReset = false;
        updateDisplay();
      }

      function del() {
        if (shouldReset) { current = '0'; shouldReset = false; }
        else {
          current = current.length > 1 ? current.slice(0, -1) : '0';
        }
        updateDisplay();
      }

      function negate() {
        if (current === '0') return;
        current = current.startsWith('-') ? current.slice(1) : '-' + current;
        updateDisplay();
      }

      function percent() {
        try {
          const val = parseFloat(current);
          current = (val / 100).toString();
        } catch {
          current = '0';
        }
        updateDisplay();
      }

      function operate(a, b, op) {
        const x = parseFloat(a);
        const y = parseFloat(b);
        if (isNaN(x) || isNaN(y)) return '0';
        switch (op) {
          case '+': return (x + y).toString();
          case '-': return (x - y).toString();
          case '*': return (x * y).toString();
          case '/': return y === 0 ? 'Error' : (x / y).toString();
          default: return b;
        }
      }

      function onOperator(op) {
        if (operator !== null && first !== null && !shouldReset) {
          current = operate(first, current, operator);
          first = current;
        } else {
          first = current;
        }
        operator = op;
        shouldReset = true;
        updateDisplay();
      }

      function equals() {
        if (operator && first !== null) {
          current = operate(first, current, operator);
          first = null;
          operator = null;
          shouldReset = true;
          updateDisplay();
        }
      }

      // Event delegation for buttons
      const grid = document.querySelector('.buttons');
      grid.addEventListener('click', (e) => {
        const btn = e.target.closest('.btn');
        if (!btn) return;
        const val = btn.dataset.value;
        if (! val) return;

        if (val === 'AC') { clearAll(); return; }
        if (val === 'DEL') { del(); return; }
        if (val === '%') { percent(); return; }
        if (val === '+') { onOperator('+'); return; }
        if (val === '-') { onOperator('-'); return; }
        if (val === '*') { onOperator('*'); return; }
        if (val === '/') { onOperator('/'); return; }
        if (val === '=') { equals(); return; }
        if (val === '.') { inputDot(); return; }

        // digits
        inputDigit(val);
      });

      // Keyboard support
      window.addEventListener('keydown', (e) => {
        const k = e.key;
        if (/\d/.test(k)) { inputDigit(k); e.preventDefault(); return; }
        if (k === '.') { inputDot(); e.preventDefault(); return; }
        if (k === '+') { onOperator('+'); e.preventDefault(); return; }
        if (k === '-') { onOperator('-'); e.preventDefault(); return; }
        if (k === '*') { onOperator('*'); e.preventDefault(); return; }
        if (k === '/') { onOperator('/'); e.preventDefault(); return; }
        if (k === 'Enter' || k === '=') { equals(); e.preventDefault(); return; }
        if (k === 'Backspace') { del(); e.preventDefault(); return; }
        if (k === 'Escape') { clearAll(); e.preventDefault(); return; }
        if (k === '%') { percent(); e.preventDefault(); return; }
      });

      // Initialize
      updateDisplay();
    })();
  </script>
</body>
</html>
